# The runtime assistant: one Worker in front of the Claude Messages API for every site that
# embeds the chat widget. The API key is a Worker secret (wrangler secret put ANTHROPIC_API_KEY)
# and never reaches a browser.
name = "fwq-assistant"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
MODEL = "claude-sonnet-5-5"
# Output budget per answer. It also covers the model's own reasoning before it writes, so it is
# well above the longest answer (about 220 words at the "With math" level); at 600, answers
# were cut off mid-sentence (stop_reason max_tokens).
MAX_TOKENS = "1500"
# Question/answer pairs sent along as conversation history (code caps it at 10).
MAX_HISTORY_TURNS = "5"
# Logged questions and answers are deleted after this many days.
RETENTION_DAYS = "30"

# One table per site that embeds the widget: the origins allowed to call, and the requests per
# visitor per UTC day and for all of the site's visitors together (a cost backstop next to the
# spend limit in the Anthropic console). Budgets are separate, so no site can use up another's.
[vars.SITES.fwq]
origins = ["https://fun-with-quantum.org", "http://localhost:4321"]
daily_visitor = 50
daily_global = 2000

# RasQberry: at a booth, every visitor at one Pi shares its address, hence the higher per-visitor limit.
[vars.SITES.rasqberry]
origins = ["https://rasqberry.org", "http://localhost:3000"]
daily_visitor = 100
daily_global = 1000

[[d1_databases]]
binding = "DB"
database_name = "fwq-assistant"
database_id = "00000000-0000-0000-0000-000000000000" # replace with the id from `wrangler d1 create fwq-assistant`
migrations_dir = "migrations"

# Burst limit per visitor: 10 requests a minute.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Daily clean-up: drops logs older than RETENTION_DAYS and old quota counters.
[triggers]
crons = ["17 3 * * *"]

# The embeddable chat widget (portal/src/lib/assistant/embed.ts → public/widget.js, built by
# `npm run widget` before every deploy), served at /widget.js for sites outside the portal.
[assets]
directory = "./public"
