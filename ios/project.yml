# The iOS app "Fun with Quantum" (xcodegen: `xcodegen generate` in ios/; see ios/README.md).
name: FunWithQuantum
options:
  bundleIdPrefix: de.lahmann
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 685X8YLYSB
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
targets:
  FunWithQuantum:
    type: application
    platform: iOS
    sources:
      - path: FunWithQuantum/Sources
      - path: FunWithQuantum/Assets.xcassets
      - path: FunWithQuantum/PrivacyInfo.xcprivacy
      # Built by scripts/build-web.mjs, bundled as a folder (site/, models/, catalog.json).
      - path: FunWithQuantum/Web
        type: folder
        buildPhase: resources
    info:
      path: FunWithQuantum/Info.plist
      properties:
        CFBundleDisplayName: Fun with Quantum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.lahmann.funwithquantum
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  FunWithQuantumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FunWithQuantum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.lahmann.funwithquantum.uitests
schemes:
  FunWithQuantum:
    build:
      targets:
        FunWithQuantum: all
        FunWithQuantumUITests: [test]
    test:
      targets: [FunWithQuantumUITests]
