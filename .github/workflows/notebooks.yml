name: Notebooks

# Every notebook at the repository root must run from top to bottom without an error — on the
# Qiskit 2.5 stack of the QuBins image every FwQ link launches (versions/2.5-xl in QuBins/qiskit-images),
# and on the newest Qiskit. Generated notebooks must match their builders in tools/, and the games
# list in README.md and Readme.ipynb must match portal/src/content/games (tools/build_games_list.py).
# Weekly as well, so a new Qiskit release that breaks a notebook shows up before players see it.
on:
  pull_request:
    paths:
      - '*.ipynb'
      - 'tools/**'
      - 'GHZGame/**'
      - 'environment.yml'
      - 'README.md'
      - 'portal/src/content/games/**'
      - 'portal/src/components/BrowserGames.astro'
      - '.github/workflows/notebooks.yml'
  push:
    branches: [master]
    paths:
      - '*.ipynb'
      - 'tools/**'
      - 'GHZGame/**'
      - 'environment.yml'
      - 'README.md'
      - 'portal/src/content/games/**'
      - 'portal/src/components/BrowserGames.astro'
      - '.github/workflows/notebooks.yml'
  schedule:
    - cron: '23 5 * * 1'   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    name: Generated notebooks match their builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nbformat
      - name: Every number in the texts is computed or listed (tools/check_numbers.py)
        run: python tools/check_numbers.py
      - name: Rebuild every generated notebook and the games list
        run: for b in tools/build_*.py; do python "$b"; done
      - name: No difference to the committed files
        run: |
          if ! git diff --exit-code -- '*.ipynb' README.md; then
            echo "::error::A generated file differs from its builder: edit tools/build_….py (or portal/src/content/games), run it, and commit both."
            exit 1
          fi

  run:
    name: Run (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qiskit 2.5, as on QuBins
            python: '3.13'
            packages: >-
              qiskit[visualization]~=2.5.2 qiskit-ibm-runtime~=0.49.0 qiskit-aer~=0.17
              qiskit-experiments~=0.14.2
          - name: newest Qiskit
            python: '3.12'
            packages: qiskit[visualization] qiskit-ibm-runtime qiskit-aer qiskit-experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv pip install --system ${{ matrix.packages }} matplotlib seaborn pylatexenc ipywidgets nbformat nbclient ipykernel
      - run: uv pip list --system | grep -i qiskit
      - name: Run every notebook
        run: python -u tools/run_notebooks.py
