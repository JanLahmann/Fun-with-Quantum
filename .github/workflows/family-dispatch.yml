name: Family manifest → notify member repos

# When family/family.json changes on master (or weekly as a backstop), tell every member repo
# to rebuild so their family footers pick up the new roster. Member repos listen with:
#   on: { repository_dispatch: { types: [family-updated] } }
on:
  push:
    branches: [master]
    paths: ['family/family.json']
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — backstop re-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      FWQ_FAMILY_TOKEN: ${{ secrets.FWQ_FAMILY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fire repository_dispatch at every member repo
        run: |
          if [ -z "$FWQ_FAMILY_TOKEN" ]; then
            echo "::notice::FWQ_FAMILY_TOKEN not set — skipping dispatch (add a fine-grained PAT with Contents: write on the member repos)."
            exit 0
          fi
          self="${GITHUB_REPOSITORY}"
          updated=$(jq -r '.updated' family/family.json)
          raw="https://raw.githubusercontent.com/${self}/master/family/family.json"
          for repo in $(jq -r '.members[].repo // empty' family/family.json | sort -u); do
            [ "$repo" = "$self" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $FWQ_FAMILY_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/dispatches" \
              -d "{\"event_type\":\"family-updated\",\"client_payload\":{\"manifest_url\":\"${raw}\",\"updated\":\"${updated}\"}}")
            echo "${repo}: HTTP ${code}"
          done

  # Files can't fetch at build time everywhere (READMEs, Jekyll sites, plain HTML), so re-render every
  # file that carries the FWQ-FAMILY markers (that is the opt-in), refresh any vendored copy named
  # fwq-family.json, and open a PR per repo (and per extra branch listed in the member's sync_branches).
  family-sync:
    runs-on: ubuntu-latest
    env:
      FWQ_FAMILY_TOKEN: ${{ secrets.FWQ_FAMILY_TOKEN }}
      GH_TOKEN: ${{ secrets.FWQ_FAMILY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-render family blocks and open PRs where they changed
        run: |
          if [ -z "$FWQ_FAMILY_TOKEN" ]; then
            echo "::notice::FWQ_FAMILY_TOKEN not set — skipping family sync."
            exit 0
          fi
          git config --global user.name "fwq-family-bot"
          git config --global user.email "fwq-family-bot@users.noreply.github.com"
          manifest="$PWD/family/family.json"
          render="$PWD/family/render/render-block.mjs"
          sync_one() {  # repo, id, branch ("" = default)
            local repo="$1" id="$2" branch="$3" dir; dir=$(mktemp -d)
            local bopt=(); [ -n "$branch" ] && bopt=(--branch "$branch")
            if ! git clone -q --depth 1 "${bopt[@]}" "https://x-access-token:${FWQ_FAMILY_TOKEN}@github.com/${repo}" "$dir" 2>/dev/null; then
              echo "${repo}@${branch:-default}: clone failed (no access?) — skipped"; return
            fi
            local base; base=$(git -C "$dir" rev-parse --abbrev-ref HEAD)
            # Only real blocks: files that contain BOTH markers, in Markdown/HTML, never under .github/ or
            # family/ (this workflow, the renderer and the docs mention the marker text themselves).
            local files; files=$(git -C "$dir" grep -l --all-match -e '<!-- FWQ-FAMILY:START' -e '<!-- FWQ-FAMILY:END -->' \
              -- '*.md' '*.mdx' '*.markdown' '*.html' ':!.github/**' ':!family/**' 2>/dev/null || true)
            local copies; copies=$(git -C "$dir" ls-files -- '*fwq-family.json' ':!family/**' || true)
            if [ -z "$files" ] && [ -z "$copies" ]; then echo "${repo}@${base}: not opted in — skipped"; return; fi
            for f in $files; do node "$render" "$manifest" "$id" "$dir/$f" >/dev/null; done
            for c in $copies; do cp "$manifest" "$dir/$c"; done
            if git -C "$dir" diff --quiet; then echo "${repo}@${base}: up to date"; return; fi
            local head="fwq-family-sync-${base}"
            git -C "$dir" checkout -q -B "$head"
            git -C "$dir" add -- $files $copies
            git -C "$dir" commit -qm "Refresh Fun with Quantum family block (manifest ${{ github.sha }})"
            git -C "$dir" push -q -f origin "$head"
            if [ -z "$(gh pr list -R "$repo" --head "$head" --base "$base" --state open --json number --jq '.[0].number')" ]; then
              gh pr create -R "$repo" --base "$base" --head "$head" \
                --title "Refresh Fun with Quantum family block" \
                --body "Automated re-render from [family.json](https://github.com/${{ github.repository }}/blob/master/family/family.json) (${{ github.sha }}): files between FWQ-FAMILY markers and any vendored fwq-family.json. Review and merge — nothing else touched."
              echo "${repo}@${base}: PR opened"
            else
              echo "${repo}@${base}: existing PR updated"
            fi
          }
          for repo in $(jq -r '.members[].repo // empty' "$manifest" | sort -u); do
            id=$(jq -r --arg r "$repo" '[.members[] | select(.repo==$r)][0].id' "$manifest")
            sync_one "$repo" "$id" ""
            for b in $(jq -r --arg r "$repo" '[.members[] | select(.repo==$r)][0].sync_branches // [] | .[]' "$manifest"); do
              sync_one "$repo" "$id" "$b"
            done
          done

  # Reminder: the automation dies silently when FWQ_FAMILY_TOKEN expires or is revoked. Every API
  # call made with the token returns its expiry in a response header; on the weekly run (and on
  # manual runs) open an issue when fewer than 30 days remain, or right away if the token no
  # longer works. One open issue at a time (label fwq-family-token).
  token-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      FWQ_FAMILY_TOKEN: ${{ secrets.FWQ_FAMILY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check token validity and expiry
        run: |
          if [ -z "$FWQ_FAMILY_TOKEN" ]; then
            title="FWQ_FAMILY_TOKEN is not set — family automation is off"
            body="The secret is empty or missing, so the dispatch and sync jobs skip every run. Create a classic PAT with the repo scope and store it as FWQ_FAMILY_TOKEN in this repo's Actions secrets (see family/README.md)."
          else
            hdr=$(curl -s -D - -o /dev/null -H "Authorization: Bearer $FWQ_FAMILY_TOKEN" https://api.github.com/user)
            status=$(printf '%s' "$hdr" | head -1 | awk '{print $2}')
            exp=$(printf '%s' "$hdr" | grep -i '^github-authentication-token-expiration:' | cut -d' ' -f2- | tr -d '\r')
            if [ "$status" != "200" ]; then
              title="FWQ_FAMILY_TOKEN no longer works (HTTP $status) — family automation is stopped"
              body="The token behind the family dispatch/sync workflow was rejected by the GitHub API (HTTP $status): expired or revoked. Create a new classic PAT (repo scope) and update the FWQ_FAMILY_TOKEN secret; then re-run the workflow manually. Details: family/README.md."
            elif [ -n "$exp" ]; then
              days=$(( ( $(date -u -d "$exp" +%s) - $(date -u +%s) ) / 86400 ))
              echo "FWQ_FAMILY_TOKEN valid, expires $exp ($days days left)"
              if [ "$days" -le 30 ]; then
                title="FWQ_FAMILY_TOKEN expires in $days days ($exp)"
                body="Rotate it before then or the family footer automation stops silently: create a new classic PAT (repo scope, note fwq-family-sync) at https://github.com/settings/tokens/new, paste it into Settings → Secrets and variables → Actions → FWQ_FAMILY_TOKEN, then run this workflow once by hand. Details: family/README.md."
              fi
            else
              echo "token valid, no expiry header (token without expiration)"
            fi
          fi
          [ -z "${title:-}" ] && exit 0
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --label fwq-family-token --state open --json number --jq '.[0].number')" ]; then
            gh label create fwq-family-token -R "$GITHUB_REPOSITORY" --description "Family automation token lifecycle" --color D93F0B 2>/dev/null || true
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label fwq-family-token --body "$body"
            echo "::warning::$title — issue opened"
          else
            echo "::warning::$title — issue already open"
          fi
