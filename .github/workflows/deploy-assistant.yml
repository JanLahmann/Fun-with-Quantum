name: Deploy assistant

# Deploys the assistant Worker (assistant/) to Cloudflare — run by hand from the Actions tab, and
# every day, so the RasQberry helpers pick up changes to the rasqberry.org pages, the demo
# manifests and the tester missions, and the tester helper knows today's open issues.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" plus
# Account · D1 · Edit), CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY. Creates the D1 database
# on the first run, applies migrations, deploys, and stores the API key as a Worker secret.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-assistant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
        shell: bash # = bash -eo pipefail: a failed `wrangler deploy | tee` must fail the job
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets are set
        working-directory: . # runs before the checkout, so assistant/ doesn't exist yet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing"; missing=1; }
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            assistant/package-lock.json
            portal/package-lock.json
      - name: The rasqberry.org pages (JanLahmann/RasQberry-Two, gh-pages)
        uses: actions/checkout@v4
        with:
          repository: JanLahmann/RasQberry-Two
          ref: gh-pages
          path: _rqb
      - name: The demo manifests (JanLahmann/RasQberry-Two, development)
        uses: actions/checkout@v4
        with:
          repository: JanLahmann/RasQberry-Two
          ref: development
          path: _rqb-dev
      - run: npm ci
      - name: Open RasQberry-Two issues (the tester helper's known issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list -R JanLahmann/RasQberry-Two --state open --limit 300 --json number,title,labels,milestone > "$RUNNER_TEMP/rqb-issues.json"
      - name: RasQberry helper knowledge from today's pages, manifests, missions and issues
        run: node scripts/rasqberry-knowledge.mjs ../_rqb ../_rqb-dev "$RUNNER_TEMP/rqb-issues.json"
      # The coin-game knowledge imports the game's code from portal/, whose tsconfig extends astro's.
      - run: npm ci --prefix ../portal
      - name: Tests and type check
        run: npm test && npm run check
      - name: D1 database (create on the first run) → wrangler.toml
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "fwq-assistant") | (.uuid // .id)'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx wrangler d1 create fwq-assistant; id=$(find_id); fi
          [ -n "$id" ] || { echo "::error::Could not find or create the D1 database"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          echo "D1 database: $id"
      - name: Apply migrations
        run: npx wrangler d1 migrations apply fwq-assistant --remote
      - name: Build the embeddable widget (public/widget.js)
        run: npm run widget
      - name: Deploy
        run: npx wrangler deploy | tee "$RUNNER_TEMP/deploy.txt"
      - name: Store the Anthropic API key as a Worker secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
      # RasQberry tester programme: optional repository secrets. Without them the tester helper
      # refuses everyone and the triage export answers 401 (fails closed); deleting a repository
      # secret also deletes the Worker secret on the next deploy, so access ends.
      - name: Store (or remove) the tester passphrase and export token as Worker secrets
        env:
          TESTER_PASSPHRASE: ${{ secrets.TESTER_PASSPHRASE }}
          TESTER_EXPORT_TOKEN: ${{ secrets.TESTER_EXPORT_TOKEN }}
        run: |
          for v in TESTER_PASSPHRASE TESTER_EXPORT_TOKEN; do
            if [ -n "${!v}" ]; then printf '%s' "${!v}" | npx wrangler secret put "$v"; else npx wrangler secret delete "$v" --force >/dev/null 2>&1 || true; echo "$v not set: removed"; fi
          done
      - name: Summary
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)
          echo "### Assistant deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: $url" >> "$GITHUB_STEP_SUMMARY"
