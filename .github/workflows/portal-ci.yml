name: Portal CI

# Tests, type check, build and internal links for every change to the portal — before it can reach master.
# (deploy-portal.yml builds and deploys after the merge.)
on:
  pull_request:
    paths:
      - 'portal/**'
      - 'family/**'
      - '.github/workflows/portal-ci.yml'
  push:
    branches: [master]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Unit tests (quantum coin math + game logic)
        run: npm test
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      # axe-core in Chromium, light and dark mode, every built page: fails on any WCAG 2.1 A/AA violation
      - name: Accessibility (axe)
        run: |
          npx playwright install --with-deps chromium
          npm run a11y
      - name: Install lychee (link checker)
        run: |
          v=0.24.2 f=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/lycheeverse/lychee/releases/download/lychee-v$v/$f"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" --strip-components=1 -C "$RUNNER_TEMP" lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Offline: every link between our own pages (also written as https://fun-with-quantum.org/…)
      # and every #anchor must exist in this build. External links: links.yml.
      - name: Internal links and anchors
        run: >-
          lychee --no-progress --offline --include-fragments --root-dir "$PWD/dist" --index-files index.html
          --remap "^https://fun-with-quantum\.org/(.*)\$ file://$PWD/dist/\$1" 'dist/**/*.html'
