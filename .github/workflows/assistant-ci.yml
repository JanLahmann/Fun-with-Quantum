name: Assistant CI

# Tests and type check for the runtime assistant Worker (assistant/), and a dry-run bundle
# that validates wrangler.toml. Deploying stays manual (wrangler deploy) for now.
on:
  pull_request:
    paths:
      - 'assistant/**'
      - 'portal/src/lib/qcoin/**' # the coin-game knowledge is built from the game's own code
      - 'portal/src/lib/assistant/**' # level labels in the rules; widget.js is built from here
      - 'portal/src/lib/level.ts'
      - '.github/workflows/assistant-ci.yml'
  push:
    branches: [master]
    paths:
      - 'assistant/**'
      - 'portal/src/lib/qcoin/**'
      - 'portal/src/lib/level.ts'
      - 'portal/src/lib/assistant/**'
      - '.github/workflows/assistant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            assistant/package-lock.json
            portal/package-lock.json
      - run: npm ci
      # The coin-game knowledge imports the game's code from portal/, whose tsconfig extends astro's.
      - run: npm ci --prefix ../portal
      - name: Unit tests (guards, streaming, logging, retention)
        run: npm test
      - name: Type check
        run: npm run check
      - name: Build the embeddable widget (public/widget.js)
        run: npm run widget
      - name: Bundle and validate wrangler.toml (dry run, no account needed)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
